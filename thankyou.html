<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>Blood Link</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"> 
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="css/slicknav.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/magnific-popup.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
	<link href="css/responsive.css" rel="stylesheet">
</head>

<body>

	<header class="main-header">
		<div class="header-sticky">
			<nav class="navbar navbar-expand-lg">
				<div class="container">
					<a class="navbar-brand" href="index.html"><img src="images/logo.png" alt=""></a>
						
					<div class="collapse navbar-collapse main-menu">
						<ul class="navbar-nav mr-auto" id="menu">
							<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
							<li class="nav-item"><a class="nav-link" href="javascript:;">About Us</a></li>
							<li class="nav-item"><a class="nav-link" href="find-blood.html">Find Blood</a></li>
							<li class="nav-item"><a class="nav-link" href="javascript:;">Donate Blood</a></li>
						</ul>
					</div>
					<div class="navbar-toggle"></div>                        
				</div>
			</nav>
			<div class="responsive-menu"></div>
		</div>
	</header>
	
	<section class="find-blood-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="request_blood_block">
						<div class="message_block">
							<p>Thanks for submitting your request.</p>
							<p><b>Please Note:</b> The requested blood type is currently available in our blood bank. Someone from our team will get in touch with you shortly.</p>
							<p>For further communication, please share the following details:</p>
						</div>
						<div class="row mt-4">
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Name
									<span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<input type="text" class="form-control" placeholder="Enter Name">
								</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Contact Number
									<span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<input type="text" class="form-control" placeholder="Enter Contact Number">
								</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Email ID
								</label>
								<div class="input-group">
									<input type="text" class="form-control" placeholder="Enter Email ID">
								</div>
							</div>
							<div class="col-md-12 text-center mt-3">
								<a href="javascript:;" class="btn submit_blood">Submit</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/SmoothScroll.js"></script>
    <script src="js/gsap.min.js"></script>
	<script src="js/SplitText.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/wow.js"></script>
    <script src="js/function.js"></script>
	
	<script>
		function addLoadEvent(func) {
				var oldonload = window.onload;
				if (typeof window.onload != 'function') {
					window.onload = func;
				} else {
					window.onload = function () {
						if (oldonload) {
							oldonload();
						}
					}
				}
			}
			addLoadEvent(setmenu('1'));
	</script>
	
</body>
</html>
