<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>Blood Link</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"> 
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="css/slicknav.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/magnific-popup.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
	<link href="css/responsive.css" rel="stylesheet">
</head>

<body>

	<header class="main-header">
		<div class="header-sticky">
			<nav class="navbar navbar-expand-lg">
				<div class="container">
					<a class="navbar-brand" href="index.html"><img src="images/logo.png" alt=""></a>
						
					<div class="collapse navbar-collapse main-menu">
						<ul class="navbar-nav mr-auto" id="menu">
							<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
							<li class="nav-item"><a class="nav-link" href="javascript:;">About Us</a></li>
							<li class="nav-item"><a class="nav-link" href="find-blood.html">Find Blood</a></li>
							<li class="nav-item"><a class="nav-link" href="javascript:;">Donate Blood</a></li>
						</ul>
					</div>
					<div class="navbar-toggle"></div>                        
				</div>
			</nav>
			<div class="responsive-menu"></div>
		</div>
	</header>
	
	<section class="find-blood-section">
		<div class="container">
			<div class="row">
				<div class="col-lg-5">
					<div class="back_btn">
						<a href="index.html"><i class="fa fa-arrow-left"></i> Back to Home</a>
					</div>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="request_blood_block">
						<h2>Request Blood</h2>
						<p>Submit a blood request and we'll notify registered donors in your area.</p>
						<div class="row mt-4">
							<div class="col-lg-12 mb-3">
								<label class="form-label">Required Blood Group: <span class="text-danger">*</span></label>
								<select class="form-select">
									<option value="-1">Select Blood Group</option>
									<option value="1">A+</option>
									<option value="2">A-</option>
									<option value="3">B+</option>
									<option value="4">B-</option>
									<option value="5">AB+</option>
									<option value="6">AB-</option>
									<option value="7">O+</option>
									<option value="8">O-</option>
								</select>
							</div>
							<div class="col-lg-12">
								<div class="mb-4">
									<label class="form-label">
										Urgency Level <span class="text-danger">*</span>
									</label>
									<div class="urgency-option">
										<input type="radio" id="critical" name="urgency" class="urgency-radio" checked>
										<label for="critical" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-danger"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
												<div>
													<h6>Critical</h6>
													<small>Within 6 hours</small>
												</div>
											</div>
										</label>
									</div>
									<div class="urgency-option">
										<input type="radio" id="urgent" name="urgency" class="urgency-radio">
										<label for="urgent" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
												<div>
													<h6>Urgent</h6>
													<small>Within 24 hours</small>
												</div>
											</div>
										</label>
									</div>
									<div class="urgency-option">
										<input type="radio" id="planned" name="urgency" class="urgency-radio">
										<label for="planned" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
												<div>
													<h6>Planned</h6>
													<small>2+ days</small>
												</div>
											</div>
										</label>
									</div>
								</div>
								<div class="date_time mb-3">
									<div class="row">
										<div class="col-md-6">
											<label class="form-label ">
												Date Needed <span class="text-danger">*</span>
											</label>
											<div class="input-group">
												<input type="date" class="form-control">
											</div>
										</div>
										<div class="col-md-6">
											<label class="form-label ">
												Time Needed <span class="text-danger">*</span>
											</label>
											<div class="input-group">
												<input type="time" class="form-control">
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Location <span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<input type="text" class="form-control" placeholder="Enter Location">
								</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Units of Blood Required
									<span class="text-danger">*</span>
								</label>
								<select class="form-select">
									<option>1 Unit</option>
									<option>2 Units</option>
									<option>3 Units</option>
									<option>4 Units</option>
									<option>5 Units</option>
								</select>
								<small class="form-note">
									Each unit is typically 500ml of whole blood
								</small>
							</div>
							<div class="col-md-12 mb-3">
								<div class="acknowledgement_card">
									<h4>Acknowledgement & Declaration</h4>	
									<div class="ack-wrapper">
										<input type="checkbox" id="acknowledgement" class="form-check-input custom-checkbox">
										<label for="acknowledgement" class="ack-content">
											<strong>Voluntary Blood Donation Compliance:</strong>
											I hereby declare and acknowledge in compliance with the Drugs and Cosmetics Act, 1940, and the National Blood Policy of India that:
											<ul class="ack-list">
												<li>This blood requirement is genuine and medically necessary</li>
												<li>Blood donation is a purely voluntary act and the donor is coming entirely by their own free will with no coercion or pressure</li>
												<li><strong>There is absolutely no monetary compensation, payment, financial transaction, or any form of financial advantage involved in this blood donation</strong></li>
												<li>No donor will receive any payment, gifts, or financial benefits for donating blood</li>
												<li>This platform is a free service connecting donors with those in need</li>
												<li>I commit to treating the donor with utmost respect, dignity, and gratitude</li>
												<li>I will provide necessary support and care to the donor during and after the donation</li>
												<li>This request is in complete compliance with Indian laws and regulations governing voluntary blood donation</li>
											</ul>
										</label>
									</div>
								</div>
							</div>
							<div class="col-md-12 text-center">
								<a href="thankyou.html" class="btn submit_blood">Submit Blood Request</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/SmoothScroll.js"></script>
    <script src="js/gsap.min.js"></script>
	<script src="js/SplitText.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/wow.js"></script>
    <script src="js/function.js"></script>
	
	<script>
		function addLoadEvent(func) {
				var oldonload = window.onload;
				if (typeof window.onload != 'function') {
					window.onload = func;
				} else {
					window.onload = function () {
						if (oldonload) {
							oldonload();
						}
					}
				}
			}
			addLoadEvent(setmenu('1'));
	</script>
	<script>
		const planned = document.getElementById("planned");
		const dateTime = document.querySelector(".date_time");

		document.querySelectorAll('input[name="urgency"]').forEach(radio => {
			radio.addEventListener("change", function () {
				if (planned.checked) {
					dateTime.style.display = "block";
				} else {
					dateTime.style.display = "none";
				}
			});
		});
	</script>
	
</body>
</html>
