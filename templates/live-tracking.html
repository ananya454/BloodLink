<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Live Delivery Tracking</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .header {
            padding: 20px;
            background-color: #8B0000;
            color: white;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .tracking-box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
        }

        .status {
            font-size: 18px;
            margin-top: 10px;
        }

        .live {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>BloodLink</h1>
        <p>Live Blood Delivery Tracking</p>
    </div>

    <div class="container">

        <div class="tracking-box">

            <h2>Delivery Tracking</h2>

            <p>
                <strong>Delivery ID:</strong>
                <span id="delivery-id">D001</span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="status">Connecting...</span>
            </p>

            <p>
                <strong>Latitude:</strong>
                <span id="latitude">--</span>
            </p>

            <p>
                <strong>Longitude:</strong>
                <span id="longitude">--</span>
            </p>

            <p>
                <strong>Last Updated:</strong>
                <span id="timestamp">--</span>
            </p>

            <p class="status">
                ● <span id="connection-status">Connecting to tracking...</span>
            </p>

        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        // Delivery we want to track
        const deliveryId = "D001";


        // Initial map position
        const initialLatitude = 18.9895;
        const initialLongitude = 73.1190;

        // Create map
        const map = L.map('map').setView(
            [initialLatitude, initialLongitude],
            14
        );

        // OpenStreetMap tiles
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // Create delivery marker
        let deliveryMarker = L.marker(
            [initialLatitude, initialLongitude]
        ).addTo(map);

        deliveryMarker.bindPopup(
            "Blood Delivery: " + deliveryId
        );

        // Function to get latest location
        function updateLocation() {
            fetch(
                `/api/delivery/${deliveryId}/location`
            )

            .then(response => response.json())
            .then(result => {

                if (!result.success) {

                    document.getElementById(
                        "connection-status"
                    ).textContent = "Delivery not found";

                    return;
                }


                const location = result.data;

                // Update information on webpage
                document.getElementById(
                    "latitude"
                ).textContent = location.latitude;

                document.getElementById(
                    "longitude"
                ).textContent = location.longitude;

                document.getElementById(
                    "status"
                ).textContent = location.status;

                document.getElementById(
                    "timestamp"
                ).textContent = location.timestamp;

                document.getElementById(
                    "connection-status"
                ).textContent = "Live tracking active";

                // Move marker
                deliveryMarker.setLatLng([
                    location.latitude,
                    location.longitude
                ]);

                // Move map to new location
                map.setView([
                    location.latitude,
                    location.longitude
                ]);

            })

            .catch(error => {

                console.error(
                    "Tracking error:",
                    error
                );

                document.getElementById(
                    "connection-status"
                ).textContent = "Connection error";
            });
        }

        // Get location immediately
        updateLocation();
        // Update location every 3 seconds
        setInterval(
            updateLocation,
            3000
        );
    </script>
</body>
</html>
